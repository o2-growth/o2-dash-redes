name: Coletar métricas

# Todo dia às 09:00 UTC (06:00 em Brasília). Também dá para rodar à mão em Actions > Coletar métricas.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar dados do Instagram
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DASH_SENHA: ${{ secrets.DASH_SENHA }}
        run: |
          if [ -z "$DASH_SENHA" ]; then echo "Falta o segredo DASH_SENHA"; exit 1; fi
          pip install -q cryptography
          python coletar.py
      - name: Gravar dados no repositório
        run: |
          git config user.name "o2-dash-bot"
          git config user.email "o2-dash-bot@users.noreply.github.com"
          git add data/painel.enc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "dados: coleta diária"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
